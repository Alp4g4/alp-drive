# Reference compose file for the VPS.
#
# One-time setup on the VPS:
#   mkdir -p /opt/alp-drive/data /opt/alp-drive/backups
#   cp deploy/docker-compose.yml /opt/alp-drive/docker-compose.yml
#
# deploy.yaml SSHes in, exports IMAGE_TAG for the session (from the git tag,
# e.g. alp-drive-v1.2.3 -> 1.2.3), then runs `docker compose pull && up -d`
# from /opt/alp-drive. Compose reads IMAGE_TAG from that shell environment.

services:
  alp-drive:
    image: ghcr.io/alp4g4/alp-drive:${IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    environment:
      ALP_DRIVE_HTTP_ADDR: ":8080"
      ALP_DRIVE_DB_PATH: "/app/data/alp-drive.db"
      ALP_DRIVE_FILES_DIR: "/app/data/files"
      ALP_DRIVE_LOG_LEVEL: "info"
